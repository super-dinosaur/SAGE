# Small real-API pilot (spec §13.3): 3-5 scenarios, K=4.
# export SILICONFLOW_API_KEY=sk-...   before running.
run:
  seed: 0
  n: 2
  m: 3
  K: 4
  k_init: null
  max_steps: 10
  keep_pruned_scores: true
  max_api_calls: 3000     # hard budget; re-running replays cached responses for free
  behavior_policy: Qwen2.5-7B-Instruct@v0
  lam_gen: 0.05

exploration: {p_high: 0.8, p_low: 0.2, p_root: 1.0, need_info_threshold: 0.5, max_roots_per_scenario: 2, max_children_per_branch: 1}

scenarios: {n: 5, seed: 0, mix: {A_self: 0.3, B_key: 0.35, C_key: 0.35}, stale_prob: 0.3, cross_owner_prob: 0.15, two_hop_prob: 0.6}

pruner: {type: llm, explore_eps: 0.1}

backends:
  default:
    type: openai_compat
    model: Qwen/Qwen2.5-7B-Instruct
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    temperature: 0.7
    max_concurrency: 8
    logprobs: true          # needed for action_logprob / need_info; falls back automatically if unsupported
    top_logprobs: 10
  roles:
    A: default              # must be the model you will train
    B: {type: openai_compat, model: Qwen/Qwen2.5-72B-Instruct, base_url: https://api.siliconflow.cn/v1, api_key_env: SILICONFLOW_API_KEY, temperature: 0.3, max_concurrency: 8, logprobs: false}
    C: {type: openai_compat, model: Qwen/Qwen2.5-72B-Instruct, base_url: https://api.siliconflow.cn/v1, api_key_env: SILICONFLOW_API_KEY, temperature: 0.3, max_concurrency: 8, logprobs: false}
    pruner: {type: openai_compat, model: Qwen/Qwen2.5-72B-Instruct, base_url: https://api.siliconflow.cn/v1, api_key_env: SILICONFLOW_API_KEY, temperature: 0.0, max_concurrency: 8, logprobs: false}

cache: runs/cache_siliconflow.sqlite   # response cache: determinism + free resume
cost: {tokenizer: regex}
export: {lam: 0.05}
